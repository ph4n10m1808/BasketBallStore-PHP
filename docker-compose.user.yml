services:
  db:
    image: ghcr.io/${GITHUB_REPOSITORY:-ph4n10m1808/basketballstore-php}-db:${APP_VERSION:-latest}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: unless-stopped
    expose:
      - 3306
    env_file: .env
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend_network

  web:
    image: ghcr.io/${GITHUB_REPOSITORY:-ph4n10m1808/basketballstore-php}-web:${APP_VERSION:-latest}
    restart: unless-stopped
    ports:
      - ${WEB_PORT:-80}:80
    env_file: .env
    depends_on:
      - db
    networks:
      - backend_network

volumes:
  db_data:

networks:
  backend_network:
    driver: bridge
