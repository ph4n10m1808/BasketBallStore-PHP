services:
  db:
    build: ./src/db
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: unless-stopped
    expose:
      - 3306
    env_file: .env
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend_network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  web:
    build: ./src/web
    restart: unless-stopped
    ports:
      - 80:80
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend_network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

volumes:
  db_data:

networks:
  backend_network:
    driver: bridge
